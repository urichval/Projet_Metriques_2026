<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Histogramme Paris</title>
  <script src="https://www.gstatic.com/charts/loader.js"></script>
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 24px; }
    #chart { width: 100%; height: 520px; }
    #status { margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Températures — Paris (7 jours)</h1>
  <div id="chart"></div>
  <div id="status"></div>
  <script>
    google.charts.load('current', { packages: ['corechart'] });
    google.charts.setOnLoadCallback(init);
    async function init() {
      const res = await fetch('/paris');
      const json = await res.json();
      const data = new google.visualization.DataTable();
      data.addColumn('string', 'Date/Heure');
      data.addColumn('number', 'Température (°C)');
      json.forEach(p => data.addRow([p.datetime.replace('T', ' '), p.temperature_c]));
      const options = {
        title: 'Températures horaires à Paris',
        legend: { position: 'none' },
        hAxis: { title: 'Date/Heure', slantedText: true, slantedTextAngle: 45 },
        vAxis: { title: '°C' },
        colors: ['#e74c3c']
      };
      new google.visualization.ColumnChart(document.getElementById('chart')).draw(data, options);
      document.getElementById('status').textContent = `OK — ${json.length} points chargés`;
    }
  </script>
</body>
</html>
