<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Contact</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, Arial, sans-serif; background: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: white; border-radius: 16px; padding: 40px; width: 100%; max-width: 500px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
    h1 { font-size: 24px; color: #2d3748; margin-bottom: 8px; }
    p { color: #718096; margin-bottom: 24px; font-size: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #4a5568; margin-bottom: 6px; }
    input, textarea { width: 100%; padding: 10px 14px; border: 1.5px solid #e2e8f0; border-radius: 8px; font-size: 14px; margin-bottom: 16px; outline: none; transition: border 0.2s; }
    input:focus, textarea:focus { border-color: #667eea; }
    textarea { height: 120px; resize: vertical; }
    button { width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #5a67d8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Contactez-moi</h1>
    <p>Laissez-moi un message et je vous répondrai rapidement.</p>
    <label>Nom</label>
    <input type="text" placeholder="Votre nom" />
    <label>Prénom</label>
    <input type="text" placeholder="Votre prénom" />
    <label>Message</label>
    <textarea placeholder="Votre message..."></textarea>
    <button>Envoyer</button>
  </div>
</body>
</html>
